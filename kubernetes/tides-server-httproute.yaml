# proper-course.app/tides through the shared edge Gateway on the pc cluster
# (defined in the ProperCourse repo, kubernetes/edge/). Replaces
# tides-server-ingress.yaml at the cutover (ProperCourse bead pc-foh.7.6).
# The server sees paths without the /tides prefix, as the Ingress's
# rewrite-target /$2 arranged: /tides -> /, /tides/foo -> /foo.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tides-server
spec:
  parentRefs:
    - name: edge
      sectionName: https
  hostnames:
    - proper-course.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /tides
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: tides-server
          port: 80
      # Envoy's default route timeout is 15s; 60s matches ingress-nginx.
      timeouts:
        request: 60s
